global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'xmind-to-md-monitor'

# 告警规则文件
rule_files:
  - 'alert_rules.yml'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # XMind 转 Markdown 服务
  - job_name: 'xmind-to-md'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
