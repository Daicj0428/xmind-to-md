apiVersion: v1
kind: Service
metadata:
  name: xmind-to-md
  namespace: default
  labels:
    app: xmind-to-md
spec:
  selector:
    app: xmind-to-md
  ports:
    - name: http
      port: 30000
      targetPort: 30000
      protocol: TCP
    - name: metrics
      port: 30000
      targetPort: 30000
      protocol: TCP
  type: ClusterIP
